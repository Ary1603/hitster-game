name: Branch Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  branch-policy:
    name: Branch policy check
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source and target branches
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          HEAD_BRANCH="${{ github.head_ref }}"

          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "develop" ]]; then
            echo "❌ Only develop can be merged into main."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "develop" ]]; then
            if [[ ! "$HEAD_BRANCH" =~ ^(feat|fix|refactor|perf|docs|test|style|build|ci|chore|hotfix|release|revert|delete)/.+$ ]]; then
              echo "❌ Only valid feature branches can be merged into develop."
              echo "Allowed prefixes: feat, fix, refactor, perf, docs, test, style, build, ci, chore, hotfix, release, revert, delete"
              exit 1
            fi
          fi

          echo "✅ Branch policy valid."
